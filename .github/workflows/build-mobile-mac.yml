name: Build macOS Mobile App

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL"
        required: true
        default: "https://webapp.songy.info/#/home"
      name:
        description: "App Name"
        required: true
        default: "XueSheng"
      icon:
        description: "Icon URL"
        required: false
        default: "https://webapp.songy.info/icons/Icon-192.png"
      width:
        description: "Window width"
        required: false
        default: "420"
      height:
        description: "Window height"
        required: false
        default: "840"
      min_width:
        description: "Min width"
        required: false
        default: "380"
      min_height:
        description: "Min height"
        required: false
        default: "640"
      hide_title_bar:
        description: "Hide title bar (macOS only)"
        required: false
        type: boolean
        default: true
      new_window:
        description: "Allow sites to open new windows"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build macOS Mobile App
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies and build CLI
        run: |
          pnpm install --frozen-lockfile=false
          pnpm run cli:build

      - name: Rust cache restore
        uses: actions/cache/restore@v4
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles("**/Cargo.lock") }}
          restore-keys: |
            ${{ runner.os }}-cargo-pake-

      - name: Build App
        run: |
          ARGS=("${{ inputs.url }}" "--name" "${{ inputs.name }}")

          if [ -n "${{ inputs.icon }}" ]; then
            ARGS+=("--icon" "${{ inputs.icon }}")
          fi

          if [ -n "${{ inputs.width }}" ]; then
            ARGS+=("--width" "${{ inputs.width }}")
          fi

          if [ -n "${{ inputs.height }}" ]; then
            ARGS+=("--height" "${{ inputs.height }}")
          fi

          if [ -n "${{ inputs.min_width }}" ]; then
            ARGS+=("--min-width" "${{ inputs.min_width }}")
          fi

          if [ -n "${{ inputs.min_height }}" ]; then
            ARGS+=("--min-height" "${{ inputs.min_height }}")
          fi

          if [ "${{ inputs.hide_title_bar }}" == "true" ]; then
            ARGS+=("--hide-title-bar")
          fi

          if [ "${{ inputs.new_window }}" == "true" ]; then
            ARGS+=("--new-window")
          fi

          echo "Running: node dist/cli.js ${ARGS[@]}"
          node dist/cli.js "${ARGS[@]}"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-macOS
          path: "*.dmg"
          retention-days: 14

      - name: Rust cache store
        uses: actions/cache/save@v4
        if: steps.cache_store.outputs.cache-hit != "true"
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles("**/Cargo.lock") }}
